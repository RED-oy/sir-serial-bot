name: Daily Auto Doctor Serial Booking

on:
  schedule:
    # বাংলাদেশ সময় সকাল 07:04 AM = UTC সময় 01:04 AM
    - cron: '4 1 * * *'
  workflow_dispatch:

jobs:
  book-serials:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install

      - name: Run Serial Automation
        run: node booking.js
