name: Schedule Serial Booking

on:
  workflow_dispatch:

jobs:
  book-serials:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Serial Booking Engine
        run: node booking.js
